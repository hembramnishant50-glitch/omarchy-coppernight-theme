# Coppernight for yazi — deep indigo + glowing copper
# Install (yazi not installed yet):
#   1. mkdir -p ~/.config/yazi/flavors/coppernight.yazi
#   2. Copy this file to ~/.config/yazi/flavors/coppernight.yazi/theme.toml
#   3. Copy ../Coppernight.tmTheme to ~/.config/yazi/flavors/coppernight.yazi/Coppernight.tmTheme
#   4. In ~/.config/yazi/theme.toml set: [flavor] dark = "coppernight"

[manager]
cwd = { fg = "#fab387", bold = true }
hovered = { fg = "#cad3f5", bg = "#313244" }
preview_hovered = { fg = "#cad3f5", bg = "#313244" }
find_keyword = { fg = "#eed49f", bold = true }
find_position = { fg = "#fab387", bg = "#313244", bold = true }
marker_copied = { fg = "#a6da95", bg = "#a6da95" }
marker_cut = { fg = "#ed8796", bg = "#ed8796" }
marker_selected = { fg = "#fab387", bg = "#fab387" }
tab_active = { fg = "#fab387", bg = "#11111b", bold = true }
tab_inactive = { fg = "#6e738d", bg = "#0b0b12" }
tab_width = 1
border_style = { fg = "#5b6078" }
syntect_theme = "Coppernight.tmTheme"

[status]
overall = { fg = "#cad3f5", bg = "#0b0b12" }
sep_left = { open = "", close = " " }
sep_right = { open = " ", close = "" }
progress_label = { fg = "#fab387", bold = true }
progress_normal = { fg = "#313244", bg = "#0b0b12" }
progress_error = { fg = "#ed8796", bg = "#0b0b12" }
perm_sep = { fg = "#5b6078" }
perm_type = { fg = "#eed49f" }
perm_read = { fg = "#a6da95" }
perm_write = { fg = "#ed8796" }
perm_exec = { fg = "#8aadf4" }

[input]
title = { fg = "#fab387", bold = true }
value = { fg = "#cad3f5" }
border = { fg = "#fab387" }

[select]
border = { fg = "#fab387" }
active = { fg = "#fab387", bold = true }
inactive = { fg = "#cad3f5" }

[tasks]
border = { fg = "#5b6078" }
title = { fg = "#fab387", bold = true }
hovered = { fg = "#cad3f5", bg = "#313244" }

[which]
cols = 3
mask = { bg = "#313244" }
cand = { fg = "#8bd5ca" }
rest = { fg = "#6e738d" }
desc = { fg = "#c6a0f6" }
separator = "  "
separator_style = { fg = "#5b6078" }

[help]
on = { fg = "#8bd5ca" }
run = { fg = "#c6a0f6" }
desc = { fg = "#cad3f5" }
hovered = { fg = "#cad3f5", bg = "#313244" }
footer = { fg = "#5b6078", bg = "#0b0b12" }

[filetype]
rules = [
  { mime = "image/*", fg = "#c6a0f6" },
  { mime = "video/*", fg = "#8aadf4" },
  { mime = "audio/*", fg = "#8bd5ca" },
  { name = "*.zip", fg = "#eed49f" },
  { name = "*.tar*", fg = "#eed49f" },
  { name = "*.rar", fg = "#eed49f" },
  { name = "*.7z", fg = "#eed49f" },
  { name = "*.md", fg = "#a6da95" },
  { name = "*.json", fg = "#fab387" },
  { name = "*.toml", fg = "#8bd5ca" },
  { name = "*.yaml", fg = "#8bd5ca" },
  { name = "*.yml", fg = "#8bd5ca" },
  { name = "*.rs", fg = "#fab387" },
  { name = "*.py", fg = "#a6da95" },
  { name = "*.js", fg = "#eed49f" },
  { name = "*.ts", fg = "#8aadf4" },
  { name = "*.sh", fg = "#a6da95" },
  { name = "*/", fg = "#8aadf4", bold = true },
]
