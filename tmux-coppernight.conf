# Coppernight for tmux — deep indigo + glowing copper
# Install: tmux source-file ~/.config/omarchy/themes/coppernight/tmux-coppernight.conf
# Or persist: echo "source-file ~/.config/omarchy/themes/coppernight/tmux-coppernight.conf" >> ~/.tmux.conf

# Status bar
set -g status-style "bg=#11111b,fg=#cad3f5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#fab387,bold] #S #[fg=#5b6078]│ "
set -g status-right "#[fg=#a5adcb]#{?client_prefix,#[fg=#fab387]PREFIX ,}#[fg=#6e738d]%H:%M #[fg=#5b6078]│ #[fg=#8aadf4]#h "

# Windows
set -g window-status-format "#[fg=#6e738d] #I:#W "
set -g window-status-current-format "#[fg=#fab387,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#eed49f"
set -g window-status-bell-style "fg=#ed8796"

# Panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#fab387"

# Messages / prompts / copy mode
set -g message-style "bg=#313244,fg=#cad3f5"
set -g message-command-style "bg=#313244,fg=#fab387"
set -g mode-style "bg=#313244,fg=#cad3f5"
set -g copy-mode-match-style "bg=#eed49f,fg=#11111b"
set -g copy-mode-current-match-style "bg=#fab387,fg=#11111b"

# Clock
set -g clock-mode-colour "#fab387"
set -g clock-mode-style 24
